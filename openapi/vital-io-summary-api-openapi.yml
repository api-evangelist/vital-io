    ClientFacingSleep:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
          description: User id returned by vital create user request. This id should be stored in your database against the user and used for all interactions with the vital api.
        date:
          type: string
          format: date-time
          title: Date
          description: Date of the specified record, formatted as ISO8601 datetime string in UTC 00:00. Deprecated in favour of calendar_date.
          deprecated: true
        calendar_date:
          type: string
          format: date
          title: Calendar Date
          description: Date of the sleep summary in the YYYY-mm-dd format. This generally matches the sleep end date.
        bedtime_start:
          type: string
          format: date-time
          title: Bedtime Start
          description: UTC Time when the sleep period started
        bedtime_stop:
          type: string
          format: date-time
          title: Bedtime Stop
          description: UTC Time when the sleep period ended
        type:
          $ref: '#/components/schemas/SleepType'
          description: "\n`long_sleep`: >=3 hours of sleep;\n`short_sleep`: <3 hours of sleep;\n`acknowledged_nap`: User-acknowledged naps, typically under 3 hours of sleep;\n`unknown`: The sleep session recording is ongoing.\n ℹ️ This enum is non-exhaustive."
        timezone_offset:
          anyOf:
          - type: integer
          - type: 'null'
          title: Timezone Offset
          description: Timezone offset from UTC as seconds. For example, EEST (Eastern European Summer Time, +3h) is 10800. PST (Pacific Standard Time, -8h) is -28800::seconds
        duration:
          type: integer
          title: Duration
          description: Total duration of the sleep period (sleep.duration = sleep.bedtime_end - sleep.bedtime_start)::seconds
        total:
          type: integer
          title: Total
          description: Total amount of sleep registered during the sleep period (sleep.total = sleep.rem + sleep.light + sleep.deep)::seconds
        awake:
          type: integer
          title: Awake
          description: Total amount of awake time registered during the sleep period::seconds
        light:
          type: integer
          title: Light
          description: Total amount of light sleep registered during the sleep period::seconds
        rem:
          type: integer
          title: Rem
          description: Total amount of REM sleep registered during the sleep period, minutes::seconds
        deep:
          type: integer
          title: Deep
          description: Total amount of deep (N3) sleep registered during the sleep period::seconds
        score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Score
          description: A value between 1 and 100 representing how well the user slept. Currently only available for Withings, Oura, Whoop and Garmin::scalar
        recovery_readiness_score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Recovery Readiness Score
          description: A value between 0 and 100 representing the provider's recovery/readiness proxy. Currently sourced from Oura readiness score, Whoop recovery score, and Ultrahuman recovery::scalar
        hr_lowest:
          anyOf:
          - type: integer
          - type: 'null'
          title: Hr Lowest
          description: The lowest heart rate (5 minutes sliding average) registered during the sleep period::beats per minute
        hr_average:
          anyOf:
          - type: integer
          - type: 'null'
          title: Hr Average
          description: The average heart rate registered during the sleep period::beats per minute
        hr_resting:
          anyOf:
          - type: integer
          - type: 'null'
          title: Hr Resting
          description: Resting heart rate recorded during a sleep session::bpm
        efficiency:
          anyOf:
          - type: number
          - type: 'null'
          title: Efficiency
          description: Sleep efficiency is the percentage of the sleep period spent asleep (100% * sleep.total / sleep.duration)::perc
        latency:
          anyOf:
          - type: integer
          - type: 'null'
          title: Latency
          description: Detected latency from bedtime_start to the beginning of the first five minutes of persistent sleep::seconds
        temperature_delta:
          anyOf:
          - type: number
          - type: 'null'
          title: Temperature Delta
          description: Skin temperature deviation from the long-term temperature average::celcius
        skin_temperature:
          anyOf:
          - type: number
          - type: 'null'
          title: Skin Temperature
          description: The skin temperature::celcius
        hr_dip:
          anyOf:
          - type: number
          - type: 'null'
          title: Hr Dip
          description: Sleeping Heart Rate Dip is the percentage difference between your average waking heart rate and your average sleeping heart rate. In health studies, a greater "dip" is typically seen as a positive indicator of overall health. Currently only available for Garmin::perc
        state:
          anyOf:
          - $ref: '#/components/schemas/SleepSummaryState'
          - type: 'null'
          description: Some providers can provide updates to the sleep summary hours after the sleep period has ended. This field indicates the state of the sleep summary. For example, TENTATIVE means the summary is an intial prediction from the provider and can be subject to change. Currently only available for Garmin and EightSleep::str ℹ️ This enum is non-exhaustive.
        average_hrv:
          anyOf:
          - type: number
          - type: 'null'
          title: Average Hrv
          description: The average heart rate variability registered during the sleep period::rmssd
        respiratory_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Respiratory Rate
          description: Average respiratory rate::breaths per minute
        source:
          $ref: '#/components/schemas/ClientFacingSource'
          description: Source the data has come from.
        sleep_stream:
          anyOf:
          - $ref: '#/components/schemas/ClientFacingSleepStream'
          - type: 'null'
          deprecated: true
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - user_id
      - date
