    - url: https://api.eu.junction.com
      x-fern-server-name: ProductionEU
    - url: https://api.sandbox.us.junction.com
      x-fern-server-name: Sandbox
    - url: https://api.sandbox.eu.junction.com
      x-fern-server-name: SandboxEU
components:
  schemas:
    ProviderConnectionCreated:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        source:
          $ref: '#/components/schemas/ClientFacingProvider'
          description: Deprecated. Use `provider` instead. Subject to removal after 1 Jan 2024.
          deprecated: true
        provider:
          $ref: '#/components/schemas/ClientFacingProvider'
        external_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External User Id
          description: '

            The unique identifier of the associated external data provider user.


            * OAuth Providers: User unique identifier; provider-specific formats

            * Password Providers: Username

            * Email Providers: Email

            * Junction Mobile SDK Providers: `null` (not available)

            '
        resource_availability:
          additionalProperties:
            $ref: '#/components/schemas/ResourceAvailability'
          propertyNames:
            $ref: '#/components/schemas/Resource'
          type: object
          title: Resource Availability
      type: object
      required:
      - user_id
      - source
      - provider
      - external_user_id
      - resource_availability
      title: ProviderConnectionCreated
      example:
        provider:
          logo: https://logo_url.com
          name: Fitbit
          slug: fitbit
        resource_availability:
          body:
            scope_requirements:
              user_denied:
                optional: []
                required: []
              user_granted:
                optional: []
                required:
                - weight
            status: available
          sleep:
            scope_requirements:
              user_denied:
                optional:
                - heartrate
                - oxygen_saturation
                - respiratory_rate
                required:
                - sleep
              user_granted:
                optional: []
                required: []
            status: unavailable
        user_id: 1449752e-0d8a-40e0-9206-91ab099b2537
    ClientFacingProviderConnectionCreatedEvent:
      properties:
        event_type:
          type: string
          const: provider.connection.created
          title: Event Type
          x-junction-exhaustive: true
        user_id:
          type: string
          format: uuid
          title: User Id
        client_user_id:
          type: string
          format: uuid
          title: Client User Id
        team_id:
          type: string
          format: uuid
          title: Team Id
        data:
          $ref: '#/components/schemas/ProviderConnectionCreated'
      type: object
      required:
      - event_type
      - user_id
      - client_user_id
      - team_id
      - data
      title: ClientFacingProviderConnectionCreatedEvent
    ProviderConnectionError:
      properties:
        provider:
          type: string
          title: Provider
        user_id:
          type: string
          format: uuid
          title: User Id
        message:
          type: string
          title: Message
        error_type:
          type: string
          enum:
          - token_refresh_failed
          - webhook_registration_failed
          - user_not_found
          - deregistered_per_provider
          - required_scopes_not_granted
          - provider_credential_error
          - provider_password_expired
          - unknown
          title: Error Type
          description: ℹ️ This enum is non-exhaustive.
        error_details:
          type: string
          title: Error Details
      type: object
      required:
      - provider
      - user_id
      - message
      - error_type
      - error_details
      title: ProviderConnectionError
      example:
        error_details: Failed to pull provider data
        error_type: token_refresh_failed
        message: We are having issues fetching information for user.                             We won't try to fetch again from this specific provider. Please reconnect device.
        provider: oura
        user_id: 1449752e-0d8a-40e0-9206-91ab099b2537
    ResourceAvailability:
      properties:
        status:
          $ref: '#/components/schemas/Availability'
          description: ℹ️ This enum is non-exhaustive.
        scope_requirements:
          anyOf:
          - $ref: '#/components/schemas/ScopeRequirementsGrants'
          - type: 'null'
      type: object
      required:
      - status
      title: ResourceAvailability
    Availability:
      type: string
      enum:
      - available
      - unavailable
      title: Availability
      description: ℹ️ This enum is non-exhaustive.
    ScopeRequirementsGrants:
      properties:
        user_granted:
          $ref: '#/components/schemas/ScopeRequirements_str_'
        user_denied:
          $ref: '#/components/schemas/ScopeRequirements_str_'
      type: object
      required:
      - user_granted
      - user_denied
      title: ScopeRequirementsGrants
    HTTPValidationError:
      properties:
        detail:
          title: Detail
