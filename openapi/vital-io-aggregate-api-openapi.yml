          - stddev
          - oldest
          - newest
          title: Func
          description: ℹ️ This enum is non-exhaustive.
        arg:
          anyOf:
          - $ref: '#/components/schemas/MCMenstrualFlowFieldExpr'
          - $ref: '#/components/schemas/MCCervicalMucusFieldExpr'
