          - period_start
          - period_end
          - cycle_end
          - is_predicted
          - menstrual_flow
          - cervical_mucus
          - intermenstrual_bleeding
          - contraceptive
          - detected_deviations
          - ovulation_test
          - home_pregnancy_test
          - home_progesterone_test
          - sexual_activity
          - basal_body_temperature
          - source_type
          - source_provider
          - source_app_id
          - source_device_id
          title: Menstrual Cycle
          description: ℹ️ This enum is non-exhaustive.
      type: object
      required:
      - menstrual_cycle
      title: MenstrualCycleColumnExpr
    DerivedReadinessColumnExpr:
      properties:
        derived_readiness:
          type: string
          enum:
          - date
