openapi: 3.2.0
info:
  title: Vital Io Aggregate API
  version: 0.4.497
  description: 'Operations tagged Aggregate across 3 of this provider''s published API definitions: vital-openapi-original.json, vital-openapi-original.yml, vital-sense-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.us.junction.com
  x-fern-server-name: Production
- url: https://api.eu.junction.com
  x-fern-server-name: ProductionEU
- url: https://api.sandbox.us.junction.com
  x-fern-server-name: Sandbox
- url: https://api.sandbox.eu.junction.com
  x-fern-server-name: SandboxEU
security:
- apiKeyAuth: []
tags:
- name: Aggregate
paths:
  /aggregate/v1/user/{user_id}/query:
    post:
      summary: Query One
      operationId: query_one_aggregate_v1_user__user_id__query_post
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: The user id to query for
      - name: accept
        in: header
        required: false
        schema:
          enum:
          - '*/*'
          - application/json
          - application/vnd.vital.tar+gzip+parquet
          type: string
          default: '*/*'
          title: Accept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryBatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregationResponse'
            application/vnd.vital.tar+gzip+parquet: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: aggregate
      x-fern-sdk-method-name: query_one
      x-fern-availability: beta
      tags:
      - Aggregate
    servers:
    - url: https://api.us.junction.com
      x-fern-server-name: Production
    - url: https://api.eu.junction.com
      x-fern-server-name: ProductionEU
    - url: https://api.sandbox.us.junction.com
      x-fern-server-name: Sandbox
    - url: https://api.sandbox.eu.junction.com
      x-fern-server-name: SandboxEU
  /aggregate/v1/user/{user_id}/continuous_query/{query_id_or_slug}/result_table:
    get:
      summary: Get Result Table For Query
      operationId: get_result_table_for_query_aggregate_v1_user__user_id__continuous_query__query_id_or_slug__result_table_get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      - name: query_id_or_slug
        in: path
        required: true
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: string
          union_mode: left_to_right
          title: Query Id Or Slug
      - name: accept
        in: header
        required: false
        schema:
          enum:
          - '*/*'
          - application/json
          - application/vnd.apache.parquet
          type: string
          default: '*/*'
          title: Accept
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregationResult'
            application/vnd.apache.parquet: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: aggregate
      x-fern-sdk-method-name: get_result_table_for_continuous_query
      x-fern-availability: beta
      tags:
      - Aggregate
    servers:
    - url: https://api.us.junction.com
      x-fern-server-name: Production
    - url: https://api.eu.junction.com
      x-fern-server-name: ProductionEU
    - url: https://api.sandbox.us.junction.com
      x-fern-server-name: Sandbox
    - url: https://api.sandbox.eu.junction.com
      x-fern-server-name: SandboxEU
  /aggregate/v1/user/{user_id}/continuous_query/{query_id_or_slug}/task_history:
    get:
      summary: Get Task History For Query
      operationId: get_task_history_for_query_aggregate_v1_user__user_id__continuous_query__query_id_or_slug__task_history_get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      - name: query_id_or_slug
        in: path
        required: true
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: string
          union_mode: left_to_right
          title: Query Id Or Slug
      - name: next_cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuousQueryTaskHistoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: aggregate
      x-fern-sdk-method-name: get_task_history_for_continuous_query
      x-fern-availability: beta
      tags:
      - Aggregate
    servers:
    - url: https://api.us.junction.com
      x-fern-server-name: Production
    - url: https://api.eu.junction.com
      x-fern-server-name: ProductionEU
    - url: https://api.sandbox.us.junction.com
      x-fern-server-name: Sandbox
    - url: https://api.sandbox.eu.junction.com
      x-fern-server-name: SandboxEU
components:
  schemas:
    AsleepAtValueMacroExpr:
      properties:
        value_macro:
          type: string
          const: asleep_at
          title: Value Macro
        version:
          type: string
          const: automatic
          title: Version
          default: automatic
      type: object
      required:
      - value_macro
      title: AsleepAtValueMacroExpr
    Period:
      properties:
        value:
          type: integer
          minimum: 1
          title: Value
          default: 1
        unit:
          type: string
          enum:
          - minute
          - hour
          - day
          - week
          - month
          - year
          title: Unit
          description: ℹ️ This enum is non-exhaustive.
      type: object
      required:
      - unit
      title: Period
    MealColumnExpr:
      properties:
        meal:
          type: string
          enum:
          - calories
          - carbohydrate_gram
          - protein_gram
          - alcohol_gram
          - water_gram
          - fibre_gram
          - sugar_gram
          - cholesterol_gram
          - saturated_fat_gram
          - monounsaturated_fat_gram
          - polyunsaturated_fat_gram
          - omega3_fat_gram
          - omega6_fat_gram
          - total_fat_gram
          - sodium_milligram
          - potassium_milligram
          - calcium_milligram
          - phosphorus_milligram
          - magnesium_milligram
          - iron_milligram
          - zinc_milligram
          - fluoride_milligram
          - chloride_milligram
          - vitamin_a_milligram
          - vitamin_b1_milligram
          - riboflavin_milligram
          - niacin_milligram
