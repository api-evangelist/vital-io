          - type: string
            const: source_app_id
          - type: string
            enum:
            - source_workout_id
            - source_sport
          - type: string
            enum:
            - timezone_offset
            - type
          - type: string
            const: value
          title: Field
          description: ℹ️ This enum is non-exhaustive.
      type: object
      required:
      - timeseries
      - field
      title: DiscreteTimeseriesExpr
    ActivityColumnExpr:
      properties:
        activity:
