          - $ref: '#/components/schemas/MCContraceptiveFieldExpr'
          - $ref: '#/components/schemas/MCDetectedDeviationsFieldExpr'
          - $ref: '#/components/schemas/MCOvulationTestFieldExpr'
          - $ref: '#/components/schemas/MCHomePregnancyTestFieldExpr'
