aid: vital-io
name: Vital
description: Vital (now operating as Junction, formerly tryVital) is a health-data API platform that gives
  digital-health, virtual-care, diagnostics, wellness, and EHR/EMR builders a single integration to wearable-device
  data and nationwide lab testing. Connect 300+ wearables and health devices — Apple HealthKit, Android
  Health Connect, Oura, Whoop, Garmin, Fitbit, Withings, Dexcom, Freestyle Libre, Withings, Polar, and
  the rest — through the Vital Link Widget; ingest normalized daily summaries and per-sample timeseries
  for sleep, activity, body, workouts, heart rate, HRV, glucose, blood pressure, SpO2, ECG, and menstrual
  cycle; order at-home testkits, at-home phlebotomy, walk-in / Patient Service Center lab collection,
  and on-site collection across all 50 U.S. states; retrieve structured biomarker results; and run Junction
  Sense continuous queries to turn raw data into clinically actionable insights. Backed by SOC 2 Type
  2, ISO 27001, GDPR-ready, and HIPAA-compliant infrastructure with both US and EU regional deployments.
type: Index
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
